name: Publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate version
        run: |
          version="$(python3 -c 'from pathlib import Path; print(Path("VERSION.md").read_text().splitlines()[2].strip())')"
          expected="v${version}"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            printf 'Tag %s does not match VERSION.md (%s)\n' "$RELEASE_TAG" "$expected"
            exit 1
          fi

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes build-essential cmake qt6-base-dev dpkg-dev

      - name: Build Linux package
        run: |
          cmake -S linux -B linux/build -DCMAKE_BUILD_TYPE=Release
          cmake --build linux/build --parallel
          cpack --config linux/build/CPackConfig.cmake --verbose -B linux/build

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: housecontrol-photoscreen-linux
          path: linux/build/*.deb
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate version
        run: |
          version="$(python3 -c 'from pathlib import Path; print(Path("VERSION.md").read_text().splitlines()[2].strip())')"
          expected="v${version}"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            printf 'Tag %s does not match VERSION.md (%s)\n' "$RELEASE_TAG" "$expected"
            exit 1
          fi

      - name: Build macOS app archive
        run: |
          swift build -c release
          version="$(python3 -c 'from pathlib import Path; print(Path("VERSION.md").read_text().splitlines()[2].strip())')"
          bin="$(swift build -c release --show-bin-path)/housecontrol-photoscreen"
          app="HouseControl PhotoScreen.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$app/Contents/Frameworks"
          cp "$bin" "$app/Contents/MacOS/housecontrol-photoscreen"
          cp "$(dirname "$bin")/libMediaRemoteAdapter.dylib" "$app/Contents/Frameworks/libMediaRemoteAdapter.dylib"
          cp -R "$(dirname "$bin")/MediaRemoteAdapter_MediaRemoteAdapter.bundle" "$app/MediaRemoteAdapter_MediaRemoteAdapter.bundle"
          install_name_tool -change "@rpath/libMediaRemoteAdapter.dylib" "@loader_path/../Frameworks/libMediaRemoteAdapter.dylib" "$app/Contents/MacOS/housecontrol-photoscreen"
          cp Info.plist "$app/Contents/Info.plist"
          if [ -f HouseControlPhotoScreen.icns ]; then cp HouseControlPhotoScreen.icns "$app/Contents/Resources/HouseControlPhotoScreen.icns"; fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$app/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$app" "HouseControl-PhotoScreen-macos.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: housecontrol-photoscreen-macos
          path: HouseControl-PhotoScreen-macos.zip
          if-no-files-found: error

  publish:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: housecontrol-photoscreen-linux
          path: release-assets

      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: housecontrol-photoscreen-macos
          path: release-assets

      - name: Publish GitHub release and upload Linux package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.deb release-assets/HouseControl-PhotoScreen-macos.zip --repo "$GITHUB_REPOSITORY" --clobber
