name: Publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate version
        run: |
          version="$(python3 -c 'from pathlib import Path; print(Path("VERSION.md").read_text().splitlines()[2].strip())')"
          expected="v${version}"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            printf 'Tag %s does not match VERSION.md (%s)\n' "$RELEASE_TAG" "$expected"
            exit 1
          fi

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes build-essential cmake qt6-base-dev dpkg-dev

      - name: Build Linux package
        run: |
          cmake -S linux -B linux/build -DCMAKE_BUILD_TYPE=Release
          cmake --build linux/build --parallel
          cpack --config linux/build/CPackConfig.cmake --verbose

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: housecontrol-photoscreen-linux
          path: linux/build/*.deb
          if-no-files-found: error

  publish:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: housecontrol-photoscreen-linux
          path: release-assets

      - name: Publish GitHub release and upload Linux package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" release-assets/*.deb --repo "$GITHUB_REPOSITORY" --clobber
